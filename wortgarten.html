<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Wortgarten</title>
<style>
  :root{
    --sky-top:#BFE3F0;
    --sky-bottom:#EAF6E6;
    --moss:#7BB889;
    --moss-dark:#5E9A6C;
    --pebble-coral:#FF9376;
    --pebble-sun:#FFCB61;
    --pebble-leaf:#8FD69A;
    --pebble-sky:#6FC3E6;
    --pebble-lilac:#C6A6E8;
    --pebble-peach:#FFB199;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 62%, var(--moss) 62%, var(--moss-dark) 100%);
    overflow:hidden; touch-action:manipulation;
    font-family:-apple-system, sans-serif;
  }
  #sky-deco{position:fixed; inset:0; pointer-events:none; z-index:0;}
  #garden{
    position:fixed; inset:0; z-index:1;
    display:flex; flex-wrap:wrap; align-content:flex-start; justify-content:center;
    gap:3vw; padding:5vh 4vw 8vh 4vw;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .tile{
    width:22vw; height:22vw; min-width:92px; min-height:92px; max-width:150px; max-height:150px;
    display:flex; align-items:center; justify-content:center;
    font-size:min(11vw, 64px);
    font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
    box-shadow:0 6px 0 rgba(0,0,0,0.08), 0 10px 18px rgba(62,92,80,0.18);
    transition:transform .32s cubic-bezier(.34,1.56,.64,1), opacity .45s ease;
    cursor:pointer;
    border:none;
  }
  .tile.shape-a{border-radius:50%;}
  .tile.shape-b{border-radius:58% 42% 53% 47% / 45% 55% 45% 55%;}
  .tile.shape-c{border-radius:42% 58% 47% 53% / 55% 45% 55% 45%;}

  .sparkle{
    position:fixed; z-index:5; pointer-events:none; font-size:22px;
    animation:rise 0.9s ease forwards;
  }
  @keyframes rise{
    0%{opacity:1; transform:translateY(0) scale(0.6);}
    100%{opacity:0; transform:translateY(-70px) scale(1.4);}
  }

  .confetti{
    position:fixed; top:-40px; z-index:9; pointer-events:none; font-size:28px;
    animation:confettiFall linear forwards;
  }
  @keyframes confettiFall{
    0%{transform:translateY(0) rotate(0deg); opacity:1;}
    100%{transform:translateY(110vh) rotate(540deg); opacity:0.9;}
  }
</style>
</head>
<body>

<svg id="sky-deco" viewBox="0 0 400 800" preserveAspectRatio="xMidYMin slice">
  <circle cx="330" cy="70" r="34" fill="#FFF6D6" opacity="0.9"/>
  <ellipse cx="70" cy="60" rx="46" ry="20" fill="#ffffff" opacity="0.7"/>
  <ellipse cx="110" cy="72" rx="34" ry="16" fill="#ffffff" opacity="0.6"/>
</svg>

<div id="garden"></div>

<script>
(function(){

  // All emoji and Polish diacritics are written as \uXXXX escapes on purpose:
  // this makes the file pure ASCII, so it displays correctly even if the
  // server sends the wrong charset header and overrides the meta tag above.
  var OBJECTS = [
    {id:"apple", c:"coral", emoji:"\uD83C\uDF4E", pl:"jab\u0142ko"},
    {id:"ball", c:"leaf", emoji:"\u26BD", pl:"pi\u0142ka"},
    {id:"dog", c:"sun", emoji:"\uD83D\uDC36", pl:"pies", sound:"Hau, hau!"},
    {id:"cat", c:"sky", emoji:"\uD83D\uDC31", pl:"kot", sound:"Miau!"},
    {id:"car", c:"lilac", emoji:"\uD83D\uDE97", pl:"samoch\u00F3d"},
    {id:"banana", c:"peach", emoji:"\uD83C\uDF4C", pl:"banan"},
    {id:"book", c:"coral", emoji:"\uD83D\uDCD6", pl:"ksi\u0105\u017Cka"},
    {id:"sun", c:"sun", emoji:"\u2600\uFE0F", pl:"s\u0142o\u0144ce"},
    {id:"moon", c:"lilac", emoji:"\uD83C\uDF19", pl:"ksi\u0119\u017Cyc"},
    {id:"star", c:"sky", emoji:"\u2B50", pl:"gwiazda"},
    {id:"water", c:"sky", emoji:"\uD83D\uDCA7", pl:"woda"},
    {id:"milk", c:"leaf", emoji:"\uD83E\uDD5B", pl:"mleko"},
    {id:"bread", c:"peach", emoji:"\uD83C\uDF5E", pl:"chleb"},
    {id:"egg", c:"sun", emoji:"\uD83E\uDD5A", pl:"jajko"},
    {id:"fish", c:"sky", emoji:"\uD83D\uDC1F", pl:"ryba"},
    {id:"bird", c:"leaf", emoji:"\uD83D\uDC26", pl:"ptak", sound:"\u0106wir, \u0107wir!"},
    {id:"tree", c:"leaf", emoji:"\uD83C\uDF33", pl:"drzewo"},
    {id:"flower", c:"lilac", emoji:"\uD83C\uDF38", pl:"kwiat"},
    {id:"shoe", c:"coral", emoji:"\uD83D\uDC5F", pl:"but"},
    {id:"hat", c:"lilac", emoji:"\uD83C\uDFA9", pl:"czapka"},
    {id:"house", c:"peach", emoji:"\uD83C\uDFE0", pl:"dom"},
    {id:"chair", c:"sun", emoji:"\uD83E\uDE91", pl:"krzes\u0142o"},
    {id:"cow", c:"leaf", emoji:"\uD83D\uDC04", pl:"krowa", sound:"Muuu!"},
    {id:"spoon", c:"sky", emoji:"\uD83E\uDD44", pl:"\u0142y\u017Cka"},
    {id:"cup", c:"coral", emoji:"\uD83E\uDD64", pl:"kubek"},
    {id:"bear", c:"peach", emoji:"\uD83D\uDC3B", pl:"mi\u015B", sound:"Gr, gr!"},
    {id:"duck", c:"sun", emoji:"\uD83E\uDD86", pl:"kaczka", sound:"Kwa, kwa!"},
    {id:"butterfly", c:"lilac", emoji:"\uD83E\uDD8B", pl:"motyl"},
    {id:"bicycle", c:"sky", emoji:"\uD83D\uDEB2", pl:"rower"},
    {id:"balloon", c:"coral", emoji:"\uD83C\uDF88", pl:"balon"}
  ];

  var COLOR_MAP = {
    coral:"var(--pebble-coral)", sun:"var(--pebble-sun)", leaf:"var(--pebble-leaf)",
    sky:"var(--pebble-sky)", lilac:"var(--pebble-lilac)", peach:"var(--pebble-peach)"
  };
  var CONFETTI_GLYPHS = ["\uD83C\uDF89","\u2728","\uD83C\uDF08","\u2B50","\uD83C\uDF3A","\uD83C\uDF88"];

  // ---------- Voices ----------
  var voices = [];
  function refreshVoices(){ voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
  if("speechSynthesis" in window){
    refreshVoices();
    window.speechSynthesis.onvoiceschanged = refreshVoices;
  }
  function voiceFor(code){
    for(var i=0;i<voices.length;i++){ if(voices[i].lang === code) return voices[i]; }
    for(var j=0;j<voices.length;j++){ if(voices[j].lang && voices[j].lang.indexOf("pl") === 0) return voices[j]; }
    return null;
  }

  var lastUtterance = null; // kept alive so some browsers don't garbage-collect it mid-speech

  function speak(text, opts){
    opts = opts || {};
    return new Promise(function(resolve){
      if(!("speechSynthesis" in window)){ resolve(); return; }
      var done = false;
      function finish(){ if(done) return; done = true; resolve(); }
      try{
        var u = new SpeechSynthesisUtterance(text);
        lastUtterance = u;
        u.lang = "pl-PL";
        var v = voiceFor("pl-PL");
        if(v) u.voice = v;
        u.rate = opts.rate || 0.85;
        u.pitch = opts.pitch || 1.05;
        u.onend = finish;
        u.onerror = finish;
        window.speechSynthesis.speak(u);
        var estMs = Math.max(900, text.length * 220);
        setTimeout(finish, estMs);
      }catch(e){
        finish();
      }
    });
  }

  function sparkleAt(el){
    var rect = el.getBoundingClientRect();
    for(var i=0;i<3;i++){
      var s = document.createElement("div");
      s.className = "sparkle";
      s.textContent = CONFETTI_GLYPHS[(i+1) % CONFETTI_GLYPHS.length];
      s.style.left = (rect.left + rect.width/2 + (i-1)*18) + "px";
      s.style.top = (rect.top + rect.height/2) + "px";
      document.body.appendChild(s);
      (function(node){ setTimeout(function(){ node.remove(); }, 950); })(s);
    }
  }

  function celebrateFinale(callback){
    var count = 26;
    for(var i=0;i<count;i++){
      (function(i){
        var c = document.createElement("div");
        c.className = "confetti";
        c.textContent = CONFETTI_GLYPHS[i % CONFETTI_GLYPHS.length];
        c.style.left = (Math.random()*94 + 2) + "vw";
        var duration = 1.6 + Math.random()*1.2;
        var delay = Math.random()*0.5;
        c.style.animationDuration = duration + "s";
        c.style.animationDelay = delay + "s";
        c.style.fontSize = (20 + Math.random()*18) + "px";
        document.body.appendChild(c);
        setTimeout(function(){ c.remove(); }, (duration+delay)*1000 + 100);
      })(i);
    }
    setTimeout(callback, 2200);
  }

  // ---------- Build garden ----------
  var garden = document.getElementById("garden");
  var busy = false;

  function buildGarden(){
    garden.innerHTML = "";
    OBJECTS.forEach(function(obj, idx){
      var tile = document.createElement("div");
      var baseRot = (idx % 2 === 0) ? -3 : 3;
      tile.className = "tile shape-" + ["a","b","c"][idx % 3];
      tile.style.background = COLOR_MAP[obj.c];
      tile.style.transform = "rotate(" + baseRot + "deg) scale(1)";
      tile.dataset.baseRot = baseRot;
      tile.textContent = obj.emoji;
      tile.addEventListener("click", function(){ handleTap(obj, tile); });
      garden.appendChild(tile);
    });
  }

  function handleTap(obj, tile){
    if(busy) return;
    busy = true;
    var watchdog = setTimeout(function(){ busy = false; }, 12000);
    function release(){ clearTimeout(watchdog); busy = false; }

    var baseRot = tile.dataset.baseRot;

    // 1) grow
    tile.style.transform = "rotate(" + baseRot + "deg) scale(1.32)";

    Promise.resolve()
      .then(function(){ return new Promise(function(r){ setTimeout(r, 320); }); })
      // 2) speak the word while enlarged
      .then(function(){ return speak(obj.pl); })
      // 3) if it's an animal, play its sound word right after
      .then(function(){
        if(obj.sound){ return speak(obj.sound, {rate:1.05, pitch:1.25}); }
      })
      // 4) fancy disappear
      .then(function(){
        sparkleAt(tile);
        tile.style.transition = "transform .55s cubic-bezier(.55,0,.55,1), opacity .55s ease";
        tile.style.transform = "rotate(" + (Number(baseRot) + 360) + "deg) scale(0)";
        tile.style.opacity = "0";
        return new Promise(function(r){ setTimeout(r, 560); });
      })
      .then(function(){
        tile.remove();
        release();
        if(garden.children.length === 0){
          celebrateFinale(buildGarden);
        }
      })
      .catch(function(err){
        console.error("Wortgarten error:", err);
        release();
      });
  }

  buildGarden();

})();
</script>
</body>
</html>
